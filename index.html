<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>一万城区域マップ</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <main>
    <header class="topbar">
      <div><span class="eyebrow">一万城区域</span><h1>区域・マンションマップ</h1></div>
      <span class="status"><i></i> プロトタイプ</span>
    </header>
    <div id="map" aria-label="一万城区域地図"></div>
    <div id="loading" class="loading" role="status">区域データを読み込んでいます…</div>
    <section class="layer-filter" aria-label="地図の表示切替">
      <div class="filter-title">表示するピン</div>
      <div class="filter-buttons" role="group">
        <button type="button" class="filter-button active" data-filter="all">すべて</button>
        <button type="button" class="filter-button" data-filter="apartments"><i class="building-dot"></i>マンション</button>
        <button type="button" class="filter-button" data-filter="restricted"><i class="restricted-dot"></i>訪問しない家</button>
      </div>
      <button type="button" id="areas-toggle" class="areas-toggle active" aria-pressed="true">区域境界 ON</button>
      <div class="status-legend" aria-label="区域管理色">
        <span><i style="--status-color:#7b4bb7"></i>M170 グループ保管</span>
        <span><i style="--status-color:#f08a24"></i>M175 貸出中</span>
        <span><i style="--status-color:#d93025"></i>M178 4か月超</span>
      </div>
      <button type="button" id="sync-areas" class="sync-button"><span>↻ 最新情報に更新</span><small id="sync-status">シート連携</small></button>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./data/apartments.js?v=3"></script>
  <script src="./data/restricted-homes.js?v=3"></script>
  <script src="./data/area-statuses.js?v=6"></script>
  <script src="./app.js?v=6"></script>
</body>
</html>
