<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>一万城区域マップ</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div><span class="eyebrow">一万城区域</span><h1>区域・マンションマップ</h1></div>
      <span class="status"><i></i> プロトタイプ</span>
    </header>
    <div id="map" aria-label="一万城区域地図"></div>
    <div id="loading" class="loading" role="status">区域データを読み込んでいます…</div>
    <div class="legend" aria-label="凡例"><span class="building-dot"></span>マンション</div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./data/apartments.js"></script>
  <script src="./app.js"></script>

</html>
